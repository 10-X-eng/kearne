    stable_name : "sketch.geometry.bspline"
    schema_version : 1
    surface : SURFACE_KIND_VALUE
    max_serialized_bytes : 65536
  };
  repeated SketchPoint2 control_points = 1
      [ (field_rules) = {max_items : 1024} ];
  repeated double knots = 2 [ (field_rules) = {
    max_items : 1050
    dimension : "Dimensionless"
    has_numeric_range : true
    minimum : -1.7976931348623157e+308
    maximum : 1.7976931348623157e+308
  } ];
  repeated double weights = 3 [ (field_rules) = {
    max_items : 1024
    dimension : "Dimensionless"
    has_numeric_range : true
    minimum : 0
    maximum : 1.7976931348623157e+308
  } ];
  uint32 degree = 4 [ (field_rules) = {
    required : true
    has_numeric_range : true
    minimum : 1
    maximum : 25
  } ];
  bool periodic = 5 [ (field_rules) = {required : true} ];
}

message SketchEntity {
  option (message_rules) = {
    stable_name : "sketch.entity"
    schema_version : 1
    surface : SURFACE_KIND_WIRE
    max_serialized_bytes : 65536
    required_oneof : "geometry"
  };
  UuidV7 id = 1
      [ (field_rules) = {required : true semantic_type : "SketchEntityId"} ];
  bool construction = 2 [ (field_rules) = {required : true} ];
  oneof geometry {
    SketchPointGeometry point = 20;
    SketchLineGeometry line = 21;
    SketchCircleGeometry circle = 22;
    SketchArcGeometry arc = 23;
    SketchEllipseGeometry ellipse = 24;
    SketchEllipticalArcGeometry elliptical_arc = 25;
    SketchHyperbolicArcGeometry hyperbolic_arc = 26;
    SketchParabolicArcGeometry parabolic_arc = 27;
    SketchBSplineGeometry bspline = 28;
  }
}

